name: litework
description: "LiteWork - 内容创作与管理工具，支持图文排版发布、短视频剪辑、富文本笔记管理"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ^3.24.0

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  provider: ^6.1.2
  get_it: ^8.0.0
  
  # 路由
  go_router: ^14.2.0
  
  # 本地存储
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI 组件
  cupertino_icons: ^1.0.8
  
  # 富文本编辑器
  flutter_quill: ^11.5.0

  # 视频与媒体处理 (新增)
  video_player: ^2.9.2
  chewie: ^1.7.0
  image_picker: ^1.0.0
  ffmpeg_kit_flutter: ^6.0.3
  path_provider: ^2.1.4
  gallery_saver: ^2.3.2
  camera: ^0.11.0
  
  # 网络与数据同步 (新增)
  dio: ^5.7.0
  http: ^1.1.0
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^5.0.0
  
  # 响应式编程
  rxdart: ^0.28.0
  
  # 图片缓存
  cached_network_image: ^3.3.0
  
  # 骨架屏效果
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12
  mockito: ^5.4.4
  test: ^1.24.0

flutter:
  uses-material-design: true
  
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
